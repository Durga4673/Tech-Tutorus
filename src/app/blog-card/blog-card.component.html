<section *ngIf="blogPost as post">
  <div class="container mt-5">
    <img [src]="post.imageUrl" class="img-fluid rounded-3 w-75" alt="Blog Image">
    <h2 class="mt-3">{{ post.title }}</h2>
    <p class="text-black-50">{{ post.date }}</p>
    <div class="fs-6" [innerHTML]="sanitizedContent"></div>
  </div>
</section>
